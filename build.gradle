/*
 * Chain Healer - heals one-sided chain conveyor connections instead of
 * amputating them, so frogports keep recognising their conveyors and players
 * can repair connections by re-connecting the chains.
 * NeoForge 1.21.1, built with ModDevGradle.
 */

plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

base {
    archivesName = "chainhealer"
    group = 'ho.artisan.chainhealer'
    version = "${mod_version}-for-create-${create_version}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    // China mirrors first for faster dependency downloads
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    mods {
        chainhealer {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }
}

dependencies {
    // Create provides the chain conveyor classes this mod heals.
    // ponder/flywheel are jar-in-jar embedded inside the Create jar; javac needs
    // them to resolve the block entity class hierarchy.
    // compileOnly: everything is present at runtime via the Create jar itself.
    compileOnly files('libs/create-1.21.1-6.0.10.jar')
    compileOnly files('libs/ponder-neoforge-1.0.82+mc1.21.1.jar')
    compileOnly files('libs/flywheel-neoforge-1.21.1-1.0.6.jar')
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            version          : version,
            mod_version      : mod_version,
            minecraft_version: minecraft_version,
            minecraft_range  : minecraft_range,
            loader_range     : loader_range,
            neoforge_range   : neoforge_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${archivesBaseName}" }
    }
    manifest {
        attributes([
                "Specification-Title"     : "chainhealer",
                "Specification-Vendor"    : "ZhaiDu11264",
                "Specification-Version"  : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version" : project.jar.archiveVersion,
                "Implementation-Vendor"   : "ZhaiDu11264",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
